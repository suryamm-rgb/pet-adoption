name: CI
on:
  push: { branches: [main] }
  pull_request:

jobs:
  server:
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:7
        ports: ["27017:27017"]
    defaults: { run: { working-directory: server } }
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm, cache-dependency-path: server/pnpm-lock.yaml }
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm audit --prod --audit-level high

  client:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: client } }
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm, cache-dependency-path: client/pnpm-lock.yaml }
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec next typegen
      - run: pnpm exec tsc --noEmit
      - run: pnpm lint
      - run: pnpm build
        env:
          NEXT_PUBLIC_API_URL: https://api.example.com/api
          NEXT_PUBLIC_SITE_URL: https://example.com

  e2e:
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:7
        ports: ["27017:27017"]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10 }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: pnpm install --frozen-lockfile
        working-directory: server
      - run: pnpm install --frozen-lockfile
        working-directory: client
      - run: pnpm exec playwright install --with-deps chromium
        working-directory: client
      - run: pnpm e2e
        working-directory: client
        env:
          CI: "true"
          E2E_CHANNEL: chromium
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            client/playwright-report
            client/test-results

  docker:
    runs-on: ubuntu-latest
    needs: [server, client, e2e]
    steps:
      - uses: actions/checkout@v4
      - run: docker build ./server
      - run: docker build ./client --build-arg NEXT_PUBLIC_API_URL=https://api.example.com/api --build-arg NEXT_PUBLIC_SITE_URL=https://example.com
